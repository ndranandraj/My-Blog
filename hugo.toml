baseURL = "https://ndranandraj.com/"
languageCode = "en-us"
title = "Anand's Blog"
theme = "PaperMod"
enableRobotsTXT = true
canonifyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60

[params]
  env = "production"
  author = "Anand Raj"
  description = "Personal blog by Anand — tech, travel, photography, and random thoughts."
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  mainSections = ["posts"]

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowRelatedContent = true
  UseHugoToc = true
  disableScrollToTop = false
  # TOC is opt-in per post via `showToc: true` in front-matter.
  # Short personal essays don't need a TOC; long data pieces do.
  ShowToc = false
  TocOpen = false

  # Default social share image used when a post has no cover.
  # Ensures LinkedIn / X / WhatsApp previews always have a visual.
  images = ["/images/Anand_enhanced.jpg"]

  # Featured hero shown on the homepage above the latest-posts strip.
  # Remove or change to promote a different post/project.
  [params.featured]
    kicker = "INVESTIGATION · FEATURED"
    title = "Same Name, Different Initial"
    description = "77 exact name-matches across 100+ constituencies. A data investigation into 4,000 candidates reveals how dummy nominations are being weaponised to split votes and confuse voters in Tamil Nadu 2026."
    url = "/posts/tn-2026-dummy-candidates/"
    image = "/images/dummy-candidates-cover.png"
    imageAlt = "Mock EVM ballot showing C. Joseph Vijay alongside four namesake decoy candidates, illustrating Tamil Nadu's dummy-candidate problem"
    cta = "Read the investigation →"

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.label]
    text = "Anand's Blog"

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Anand"
    subtitle = "Software engineer and data analyst by day. Photographer, football fan, and occasional builder of random things. I write about tech, travel, and everything in between."
    imageUrl = "/images/Anand_enhanced.jpg"
    imageTitle = "Anand"
    imageWidth = 160
    imageHeight = 160
    [[params.profileMode.buttons]]
      name = "Read the Blog"
      url = "/posts/"
    [[params.profileMode.buttons]]
      name = "About Me"
      url = "/page/about/"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/anandraj-r-78b86198"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/ndranandraj"
  [[params.socialIcons]]
    name = "goodreads"
    url = "https://www.goodreads.com/user/show/16492967-anandraj-r"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

[services.googleAnalytics]
  ID = "G-WG6FZGEPT7"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/page/about/"
    weight = 2
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 3
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 4
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 5

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Exclude the image originals backup folder from publishing.
# Safe-kept locally (in case we want to re-derive higher-res copies)
# but not shipped to the live site.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = "images/_originals_backup/**"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
