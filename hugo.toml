baseURL = "https://ndranandraj.com/"
languageCode = "en-us"
title = "Anand's Blog"
# PaperMod is pulled in via Hugo Modules (see [module.imports] below). The legacy
# `theme = "PaperMod"` line + `themes/PaperMod` submodule are retained as a
# fallback during the migration. Once CI is green on modules, delete the submodule
# and this comment block.
theme = "PaperMod"
enableRobotsTXT = true
# canonifyURLs is legacy; relative URLs serve better and don't break preview deploys.

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Fallback values. Per-page overrides live in layouts/sitemap.xml and
# `sitemap:` frontmatter keys on individual posts.
[sitemap]
  changefreq = "monthly"
  priority = 0.5

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60

[params]
  env = "production"
  author = "Anandraj"
  description = "Personal blog by Anand — tech, travel, photography, and random thoughts."
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  mainSections = ["posts", "data"]

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowRelatedContent = true
  UseHugoToc = true
  disableScrollToTop = false
  # TOC is opt-in per post via `showToc: true` in front-matter.
  # Short personal essays don't need a TOC; long data pieces do.
  ShowToc = false
  TocOpen = false

  # Default social share image used when a post has no cover.
  # Ensures LinkedIn / X / WhatsApp previews always have a visual.
  images = ["/images/Anand_enhanced.jpg"]

  # Featured hero shown on the homepage above the latest-posts strip.
  # Remove or change to promote a different post/project.
  [params.featured]
    kicker = "RESULTS DAY · MAY 4, 2026"
    title = "TVK 233: A Debut, Mapped"
    description = "Vijay's TVK won 108 of 233 contested seats with 34.92% of the vote and the highest seat-to-vote efficiency of any major party. This is the regional anatomy of that result — where the wave broke and where it didn't."
    url = "/posts/tvk-debut-2026/"
    image = "/images/tvk-debut-cover.png"
    imageAlt = "TVK 233: A Debut, Mapped — data analysis of Vijay's Tamilaga Vettri Kazhagam in the Tamil Nadu 2026 Assembly Election"
    cta = "Read the analysis →"

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.label]
    text = "Anand's Blog"

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Anand"
    subtitle = "Software engineer and data analyst by day. Photographer, football fan, and occasional builder of random things. I write about tech, travel, and everything in between."
    imageUrl = "/images/Anand_enhanced.jpg"
    imageTitle = "Anand"
    imageWidth = 160
    imageHeight = 160
    [[params.profileMode.buttons]]
      name = "Read the Blog"
      url = "/posts/"
    [[params.profileMode.buttons]]
      name = "About Me"
      url = "/page/about/"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/anandraj-r-78b86198"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/ndranandraj"
  [[params.socialIcons]]
    name = "goodreads"
    url = "https://www.goodreads.com/user/show/16492967-anandraj-r"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

[services.googleAnalytics]
  ID = "G-WG6FZGEPT7"

# Cloudflare Web Analytics beacon. Cookieless, privacy-friendly, harder for
# ad-blockers to kill than GA. Get the token from Cloudflare dashboard →
# Analytics & Logs → Web Analytics → Add a site (manual).
[params.cloudflareWebAnalytics]
  token = "c945c24d7e5b49188ebd981ed6746ec0"

# Buttondown newsletter embed. Leave `username` empty to hide the subscribe
# form entirely; fill it in after creating the free account at
# https://buttondown.com and the form on every post becomes active.
[params.buttondown]
  username = "ndranandraj"

# Search-engine webmaster verification. Leave values empty until you verify
# ownership in each console (they'll hand you a token string to drop in here).
#   googleSiteVerification — Search Console > Add property > HTML tag method
#   bingSiteVerification    — Bing Webmaster Tools > Add site > Meta tag method
# Once populated, layouts/partials/extend_head.html emits the meta tags.
[params.siteVerification]
  google = ""
  bing = ""

# IndexNow push-indexing. The key below matches the file at
# /static/{key}.txt served at https://ndranandraj.com/{key}.txt — required so
# search engines can verify you own the key when you ping them with new URLs.
# Regenerate the pair with `openssl rand -hex 16` if ever rotated.
[params.indexNow]
  key = "9c9bdc14f5d62a6f18f1c69a5ff43a6a"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/page/about/"
    weight = 2
  [[menu.main]]
    name = "Data"
    url = "/data/"
    weight = 3
  [[menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 4
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 5
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 6

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Hugo Modules configuration.
#   - `imports` pulls PaperMod from its canonical Git URL (no submodule needed).
#   - `mounts` re-declares every source directory because once you set any
#     mount, Hugo stops auto-mounting the defaults.
# High-resolution image masters live in `.image-originals/` at the repo root,
# which Hugo never sees because it's not mounted.
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
