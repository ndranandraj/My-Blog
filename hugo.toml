baseURL = "https://ndranandraj.com/"
languageCode = "en-us"
title = "Anand's Blog"
# PaperMod is loaded via Hugo Modules only (see [module.imports] below), pinned
# in go.mod. The legacy `theme = "PaperMod"` line and the themes/PaperMod
# submodule have been removed as part of the modules cutover (see
# docs/MIGRATE-TO-HUGO-MODULES.md). Build locally to confirm before pushing.
enableRobotsTXT = true
# canonifyURLs is legacy; relative URLs serve better and don't break preview deploys.

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Fallback values. Per-page overrides live in layouts/sitemap.xml and
# `sitemap:` frontmatter keys on individual posts.
[sitemap]
  changefreq = "monthly"
  priority = 0.5

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "categories"
    weight = 60

[params]
  env = "production"
  author = "Anandraj"
  description = "Personal blog by Anand — tech, travel, photography, and random thoughts."
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  mainSections = ["posts", "data"]

  # Homepage hero "NOW" badge (the small card on the portrait). Edit freely;
  # leave empty to hide the badge. Eyebrow above the headline is `heroEyebrow`.
  now = "Mapping TN 2026"
  heroEyebrow = "Writing · Data · Photography"

  # giscus comments render on posts when [params.giscus] below is filled in.
  # Set `comments: false` in a post's front matter to hide them on that post.
  comments = true

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowRelatedContent = true
  UseHugoToc = true
  disableScrollToTop = false
  # TOC is opt-in per post via `showToc: true` in front-matter.
  # Short personal essays don't need a TOC; long data pieces do.
  ShowToc = false
  TocOpen = false

  # Default social share image used when a post sets no `cover.image`.
  # PaperMod's opengraph partial reads this list and emits each entry as a
  # separate <meta property="og:image"> tag. Path is relative to /static so
  # `/images/og-default.png` lives at `static/images/og-default.png`.
  # Regenerate the card with `python3 /tmp/make_og.py` (script in CLAUDE.md
  # under "Common tasks") or hand-edit the PNG.
  images = ["/images/og-default.png"]

  # NOTE (July 2026): the old [params.featured] homepage-hero block was removed.
  # No layout reads it anymore; the homepage features come from the dashboards
  # partial and per-post `featured: true` front matter.

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.label]
    text = "Anand's Blog"

  [params.profileMode]
    enabled = true
    title = "Hi, I'm Anand"
    subtitle = "Software engineer and data analyst by day. Photographer, football fan, and occasional builder of random things. I write about tech, travel, and everything in between."
    imageUrl = "/images/Anand_enhanced.jpg"
    imageTitle = "Anand"
    imageWidth = 118
    imageHeight = 118
    [[params.profileMode.buttons]]
      name = "TN 2026 Explorer"
      url = "/election-dashboard/tn-2026-explorer.html"
    [[params.profileMode.buttons]]
      name = "Read the Blog"
      url = "/posts/"
    [[params.profileMode.buttons]]
      name = "About Me"
      url = "/page/about/"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/anandraj-r-78b86198"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/ndranandraj"
  [[params.socialIcons]]
    name = "goodreads"
    url = "https://www.goodreads.com/user/show/16492967-anandraj-r"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

[services.googleAnalytics]
  ID = "G-WG6FZGEPT7"

# Cloudflare Web Analytics beacon. Cookieless, privacy-friendly, harder for
# ad-blockers to kill than GA. Get the token from Cloudflare dashboard →
# Analytics & Logs → Web Analytics → Add a site (manual).
[params.cloudflareWebAnalytics]
  token = "c945c24d7e5b49188ebd981ed6746ec0"

# giscus comments (GitHub Discussions). Setup, one time:
#   1. Make sure the blog repo (or a dedicated public repo) has Discussions
#      enabled: GitHub repo → Settings → Features → Discussions.
#   2. Install the giscus app on that repo: https://github.com/apps/giscus
#   3. Visit https://giscus.app, enter the repo, pick the "Announcements"-type
#      category you want (create one named "Comments"), and copy the repoId
#      and categoryId values it generates into the fields below.
# Comments stay hidden until repoId and categoryId are filled in.
[params.giscus]
  repo = ""        # e.g. "ndranandraj/anand-blog"
  repoId = ""
  category = "Comments"
  categoryId = ""

# Buttondown newsletter embed. Leave `username` empty to hide the subscribe
# form entirely; fill it in after creating the free account at
# https://buttondown.com and the form on every post becomes active.
[params.buttondown]
  username = "ndranandraj"

# Search-engine webmaster verification. Leave values empty until you verify
# ownership in each console (they'll hand you a token string to drop in here).
#   googleSiteVerification — Search Console > Add property > HTML tag method
#   bingSiteVerification    — Bing Webmaster Tools > Add site > Meta tag method
# Once populated, layouts/partials/extend_head.html emits the meta tags.
[params.siteVerification]
  google = ""
  bing = ""

# IndexNow push-indexing. The key below matches the file at
# /static/{key}.txt served at https://ndranandraj.com/{key}.txt — required so
# search engines can verify you own the key when you ping them with new URLs.
# Regenerate the pair with `openssl rand -hex 16` if ever rotated.
[params.indexNow]
  key = "9c9bdc14f5d62a6f18f1c69a5ff43a6a"

# Grouped nav (REBRAND June 2026): Blog · TN 2026 ▾ · Photography · Data · About.
# TN 2026 is a dropdown parent (identifier "tn2026") with four children.
# Search is rendered as an icon button and Archive lives in the footer, so
# neither is a menu.main entry. The custom header partial (layouts/partials/
# header.html) renders .Children as a dropdown / inline mobile group.
[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tn2026"
    name = "TN 2026"
    url = "/tamil-nadu-elections-2026/"
    weight = 20
  [[menu.main]]
    name = "Analysis"
    parent = "tn2026"
    url = "/tamil-nadu-elections-2026/"
    weight = 21
    [menu.main.params]
      desc = "Seat-by-seat breakdowns & trends"
  [[menu.main]]
    name = "Results"
    parent = "tn2026"
    url = "/tn-2026-results/"
    weight = 22
    [menu.main.params]
      desc = "All 234 seats, 2021 comparison"
  [[menu.main]]
    name = "Explorer ↗"
    parent = "tn2026"
    url = "/election-dashboard/tn-2026-explorer.html"
    weight = 23
    [menu.main.params]
      desc = "Live interactive dashboard"
  [[menu.main]]
    name = "Dataset"
    parent = "tn2026"
    url = "/data/tn-2026-candidates/"
    weight = 24
    [menu.main.params]
      desc = "Every candidate · CC BY 4.0"
  [[menu.main]]
    name = "Photography"
    url = "/categories/photography/"
    weight = 30
  [[menu.main]]
    name = "Data"
    url = "/data/"
    weight = 40
  [[menu.main]]
    name = "About"
    url = "/page/about/"
    weight = 50

[pagination]
  pagerSize = 9

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Hugo Modules configuration.
#   - `imports` pulls PaperMod from its canonical Git URL (no submodule needed).
#   - `mounts` re-declares every source directory because once you set any
#     mount, Hugo stops auto-mounting the defaults.
# High-resolution image masters live in `.image-originals/` at the repo root,
# which Hugo never sees because it's not mounted.
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
