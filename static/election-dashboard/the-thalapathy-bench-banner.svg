<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ecd6"/>
      <stop offset="100%" stop-color="#ead9b7"/>
    </linearGradient>
    <g id="bust">
      <path d="M -28 0
               L -26 -24
               C -22 -34, -12 -38, -4 -38
               L 4 -38
               C 12 -38, 22 -34, 26 -24
               L 28 0 Z"
            fill="#3a0d04"/>
      <rect x="-5" y="-45" width="10" height="9" fill="#3a0d04"/>
      <ellipse cx="0" cy="-60" rx="13" ry="16" fill="#3a0d04"/>
      <path d="M -12 -72 Q 0 -78, 12 -72 Q 6 -75, 0 -75 Q -6 -75, -12 -72 Z"
            fill="#240500"/>
    </g>
    <g id="marigoldDot">
      <circle r="4.5" fill="#b8862b"/>
      <circle r="2" fill="#fff4d2"/>
    </g>
  </defs>

  <rect width="1200" height="500" fill="url(#paper)"/>

  <line x1="340" y1="64" x2="860" y2="64" stroke="#b8862b" stroke-width="0.8" opacity="0.7"/>
  <text x="600" y="93" text-anchor="middle" font-size="13" fill="#b8862b" letter-spacing="6" font-weight="600">TAMIL NADU ASSEMBLY  ·  2026 VOTE OF CONFIDENCE</text>

  <text x="600" y="180" text-anchor="middle" font-size="78" fill="#4a1208" font-weight="700" letter-spacing="0.5">The Thalapathy Bench</text>

  <text x="600" y="222" text-anchor="middle" font-size="21" fill="#4a1208" font-style="italic" opacity="0.85">Twelve TVK MLAs in the new Assembly share the founder's name.</text>

  <g transform="translate(600,265)">
    <line x1="-50" y1="0" x2="-14" y2="0" stroke="#b8862b" stroke-width="0.8"/>
    <use href="#marigoldDot"/>
    <line x1="14" y1="0" x2="50" y2="0" stroke="#b8862b" stroke-width="0.8"/>
  </g>

  <g transform="translate(0,388)">
    <line x1="120" y1="0" x2="1080" y2="0" stroke="#4a1208" stroke-width="1.2" opacity="0.55"/>

    <use href="#bust" x="160"/>
    <use href="#bust" x="240"/>
    <use href="#bust" x="320"/>
    <use href="#bust" x="400"/>
    <use href="#bust" x="480"/>
    <use href="#bust" x="560"/>
    <use href="#bust" x="640"/>
    <use href="#bust" x="720"/>
    <use href="#bust" x="800"/>
    <use href="#bust" x="880"/>
    <use href="#bust" x="960"/>
    <use href="#bust" x="1040"/>

    <g font-size="11" fill="#b8862b" text-anchor="middle" letter-spacing="2" font-weight="600">
      <text x="160" y="22">01</text>
      <text x="240" y="22">02</text>
      <text x="320" y="22">03</text>
      <text x="400" y="22">04</text>
      <text x="480" y="22">05</text>
      <text x="560" y="22">06</text>
      <text x="640" y="22">07</text>
      <text x="720" y="22">08</text>
      <text x="800" y="22">09</text>
      <text x="880" y="22">10</text>
      <text x="960" y="22">11</text>
      <text x="1040" y="22">12</text>
    </g>
  </g>

  <g transform="translate(600,460)">
    <line x1="-200" y1="-12" x2="-110" y2="-12" stroke="#b8862b" stroke-width="0.6" opacity="0.6"/>
    <line x1="110" y1="-12" x2="200" y2="-12" stroke="#b8862b" stroke-width="0.6" opacity="0.6"/>
    <text x="0" y="-7" text-anchor="middle" font-size="14" fill="#4a1208" letter-spacing="8" font-weight="600">EACH OF THEM A VIJAY</text>
  </g>
</svg>
