name: PR Preview Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  HUGO_VERSION: 0.153.0
  HUGO_CACHEDIR: /tmp/hugo_cache

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (extended, pinned)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HUGO_CACHEDIR }}
            resources
          key: ${{ runner.os }}-hugo-preview-${{ env.HUGO_VERSION }}-${{ hashFiles('**/hugo.toml','**/go.sum','**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-hugo-preview-${{ env.HUGO_VERSION }}-

      - name: Build site (drafts enabled)
        env:
          HUGO_ENVIRONMENT: staging
          HUGO_ENV: staging
        run: |
          hugo \
            --gc \
            --minify \
            --buildDrafts \
            --buildFuture \
            --baseURL "http://localhost:8080/" \
            --logLevel warn

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: ./public
          retention-days: 7

      - name: Run Lighthouse against preview
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/posts/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouserc.json
          runs: 1
          serverBaseUrl: http://localhost:8080
          serverCommand: npx --yes http-server ./public -p 8080 -s

      - name: Comment build summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const body = [
              '### ✅ Preview build succeeded',
              '',
              'The static site was built from this PR. Download the `site-preview-' + pr + '` artifact from the workflow run to browse locally, or inspect the Lighthouse report uploaded above.',
              '',
              '_Generated by pr-preview.yml_'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
